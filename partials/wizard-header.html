    <!-- =========================================================================
         SHARED SETUP WIZARD HEADER (VISIBLE ON PAIRING, TRAINING & AVATAR SCREENS)
         ========================================================================= -->
    <header id="wizardHeaderBar" class="hidden fixed top-0 inset-x-0 z-30 px-3 sm:px-5 pt-2.5 sm:pt-3 pointer-events-none">
        <div class="max-w-5xl mx-auto bg-gray-950/85 backdrop-blur-xl border border-gray-800/90 rounded-2xl px-3.5 py-2 shadow-2xl flex flex-wrap items-center justify-between gap-2.5 pointer-events-auto">
            <div class="flex items-center gap-2.5">
                <img src="loop-kicker-journey.svg" alt="Loop Kicker Journey Logo" class="w-8 h-8 drop-shadow">
                <span class="text-sm sm:text-base font-black tracking-tight bg-gradient-to-r from-emerald-400 via-amber-300 to-orange-400 bg-clip-text text-transparent">
                    Loop Kicker Journey
                </span>
            </div>

            <!-- Stepper Pills -->
            <nav aria-label="Setup Steps" class="flex flex-wrap items-center gap-1.5">
                <button type="button" data-step-nav="pairing"
                        class="px-2.5 sm:px-3 py-1 rounded-xl text-xs font-bold transition cursor-pointer border">
                    1 · Pairing
                </button>
                <span class="text-gray-600 text-xs hidden sm:inline">›</span>
                <button type="button" data-step-nav="training"
                        class="px-2.5 sm:px-3 py-1 rounded-xl text-xs font-bold transition cursor-pointer border">
                    2 · Training
                </button>
                <span class="text-gray-600 text-xs hidden sm:inline">›</span>
                <button type="button" data-step-nav="avatar"
                        class="px-2.5 sm:px-3 py-1 rounded-xl text-xs font-bold transition cursor-pointer border">
                    3 · Avatar
                </button>
                <span class="text-gray-600 text-xs hidden sm:inline">›</span>
                <button type="button" data-step-nav="game"
                        class="px-2.5 sm:px-3 py-1 rounded-xl text-xs font-bold transition cursor-pointer border">
                    4 · Flight
                </button>
            </nav>

            <!-- Resume Active Flight + Audio Toggles -->
            <div class="flex items-center gap-1.5">
                <button id="wizardReturnToGameBtn" type="button"
                        class="hidden px-3 py-1 rounded-xl bg-gradient-to-r from-emerald-500 to-green-400 hover:from-emerald-400 hover:to-green-300 text-gray-950 font-black text-xs uppercase tracking-wide cursor-pointer shadow transition">
                    Return to Flight ▶
                </button>
                <button id="wizardSoundToggleBtn" type="button"
                        class="p-1.5 rounded-xl bg-gray-800/90 hover:bg-gray-700 text-amber-400 border border-gray-700 transition cursor-pointer"
                        title="Toggle arcade audio synthesizer">
                    <svg id="wizardSoundOnIcon" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"/>
                    </svg>
                    <svg id="wizardSoundOffIcon" class="w-4 h-4 hidden text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z M17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2"/>
                    </svg>
                </button>
                <button id="wizardMusicToggleBtn" type="button"
                        class="p-1.5 rounded-xl bg-gray-800/90 hover:bg-gray-700 text-fuchsia-400 border border-gray-700 transition cursor-pointer disabled:opacity-40 disabled:cursor-not-allowed"
                        title="Toggle adaptive music">
                    <svg id="wizardMusicOnIcon" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3"/>
                    </svg>
                    <svg id="wizardMusicOffIcon" class="w-4 h-4 hidden text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM3 3l18 18"/>
                    </svg>
                </button>
            </div>
        </div>
    </header>
