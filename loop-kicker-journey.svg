<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
    <title>Loop Kicker Journey</title>
    <defs>
        <linearGradient id="lkj-bg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0f172a"/>
            <stop offset="45%" stop-color="#1e1b4b"/>
            <stop offset="100%" stop-color="#047857"/>
        </linearGradient>
        <linearGradient id="donut-grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#fde047"/>
            <stop offset="50%" stop-color="#f97316"/>
            <stop offset="100%" stop-color="#ec4899"/>
        </linearGradient>
        <linearGradient id="dragon-grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#f87171"/>
            <stop offset="100%" stop-color="#dc2626"/>
        </linearGradient>
    </defs>

    <!-- App Icon Rounded Background -->
    <rect width="512" height="512" rx="140" fill="url(#lkj-bg)"/>

    <!-- Sky Clouds -->
    <g fill="#ffffff" opacity="0.18">
        <circle cx="120" cy="135" r="28"/>
        <circle cx="148" cy="130" r="34"/>
        <circle cx="176" cy="138" r="24"/>
        <circle cx="370" cy="115" r="24"/>
        <circle cx="395" cy="110" r="30"/>
    </g>

    <!-- 3D Perspective Donut Gate (Back Half) -->
    <ellipse cx="290" cy="235" rx="115" ry="135" fill="none" stroke="url(#donut-grad)" stroke-width="34" opacity="0.92"/>
    <ellipse cx="290" cy="235" rx="115" ry="135" fill="none" stroke="#fef08a" stroke-width="8" opacity="0.6"/>

    <!-- Upwind Stream Lines -->
    <g stroke="#38bdf8" stroke-width="5" stroke-linecap="round" opacity="0.65" stroke-dasharray="14 12">
        <path d="M 95 360 Q 115 260 95 160"/>
        <path d="M 415 370 Q 435 270 415 170"/>
    </g>

    <!-- Flying 3D Dragon Silhouette -->
    <g>
        <!-- Left & Right Wings -->
        <path d="M 210 250 L 95 155 L 135 235 L 105 265 L 195 275 Z" fill="url(#dragon-grad)" stroke="#fecaca" stroke-width="5" stroke-linejoin="round"/>
        <path d="M 245 245 L 365 135 L 335 225 L 360 250 L 255 270 Z" fill="url(#dragon-grad)" stroke="#fecaca" stroke-width="5" stroke-linejoin="round"/>
        <!-- Dragon Body, Tail & Head -->
        <path d="M 140 345 Q 185 310 220 260 L 265 220 L 305 205 L 285 235 L 245 280 Q 195 330 140 345 Z" fill="#dc2626" stroke="#fef2f2" stroke-width="5" stroke-linejoin="round"/>
        <!-- Dragon Fire Breath -->
        <path d="M 312 202 L 395 172 L 365 205 L 408 215 L 312 214 Z" fill="#facc15"/>
    </g>

    <!-- Ground Pine Trees -->
    <g fill="#065f46" opacity="0.85">
        <polygon points="110,440 130,390 150,440"/>
        <polygon points="150,445 175,380 200,445"/>
        <polygon points="330,445 355,385 380,445"/>
        <polygon points="370,440 390,395 410,440"/>
    </g>

    <!-- 3D Badge -->
    <rect x="34" y="38" width="116" height="52" rx="16" fill="#f97316"/>
    <text x="92" y="74" font-family="sans-serif" font-weight="900" font-size="26" fill="#0f172a" text-anchor="middle">LKJ</text>
</svg>
